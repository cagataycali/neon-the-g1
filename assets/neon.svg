<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120" role="img" aria-label="neon">
  <defs>
    <!-- Cyan → magenta gradient that pulses across -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#b967ff"/>
      <stop offset="100%" stop-color="#ff2a6d"/>
      <animate attributeName="x1" values="-100%;0%;-100%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Subtle glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent bg — inherits page -->
  <rect width="400" height="120" fill="transparent"/>

  <!-- Tiny pulsing dot (the "o" in neon becomes a signal) -->
  <g transform="translate(200,60)" filter="url(#glow)">
    <!-- wordmark -->
    <text x="0" y="12" text-anchor="middle"
          font-family="'JetBrains Mono','SF Mono','Fira Code',ui-monospace,monospace"
          font-size="56" font-weight="600" letter-spacing="-2"
          fill="url(#neonGrad)">neon</text>

    <!-- pulse line under the wordmark -->
    <line x1="-70" y1="28" x2="70" y2="28"
          stroke="url(#neonGrad)" stroke-width="1" opacity="0.6">
      <animate attributeName="stroke-dasharray" values="0,140;140,0;0,140" dur="4s" repeatCount="indefinite"/>
    </line>

    <!-- micro dot, pulsing -->
    <circle cx="0" cy="-30" r="2" fill="#00f0ff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1.5;3;1.5" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
