site_name: neon
site_url: https://cagataycali.github.io/neon-the-g1
site_description: "neon, a Strands agent for the Unitree G1+ humanoid: minimalist, AST-verified, safety-gated, on the edge."
site_author: Cagatay Cali
repo_url: https://github.com/cagataycali/neon-the-g1
repo_name: cagataycali/neon-the-g1
edit_uri: edit/main/docs/
copyright: "neon / vision, language, action on the edge"

exclude_docs: |
  /dashboard/
  *.bak
  .docs-revamp.md

extra_css:
  - stylesheets/neon.css?v=9   # bump on CSS changes to bust browser cache

extra_javascript:
  # mermaid fences (class sr-diagram) are rendered by javascripts/mermaid.js from the page tokens, in both schemes
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid.js?v=1
  - javascripts/motion.js?v=2

nav:
  - Home: index.md
  - Start:
      - Quickstart: start/quickstart.md
      - Docker: start/docker.md
      - Systemd: start/systemd.md
  - Showcase:
      - Gestures: showcase/gestures.md
      - Locomotion: showcase/locomotion.md
      - Workflow: showcase/workflow.md
  - Recipes:
      - Overview: recipes/index.md
      - stand → wave → sit: recipes/hello.md
      - SLAM-guided walk: recipes/walk.md
      - Describe the room: recipes/perception.md
      - Map a space: recipes/slam.md
      - Telegram control: recipes/telegram.md
  - Tools:
      - Catalog: tools/catalog.md
      - Composed (safety-gated): tools/composed.md
      - use_unitree (universal): tools/use-unitree.md
      - use_dds (generic pub/sub): tools/use-dds.md
      - Sensing: tools/sensing.md
  - Guide:
      - Safety model: guide/safety.md
      - Architecture: guide/architecture.md
      - Troubleshooting: guide/troubleshooting.md
      - CLI tips: guide/cli.md
      - Extending: guide/extending.md
      - strands-robots integration: guide/strands-robots.md
      - WebXR teleop (Quest 3): guide/webxr-teleop.md
      - Dashboard: guide/dashboard.md
      - Voice architecture: voice-architecture.md
  - Reference:
      - FSM + error codes: reference/fsm.md
      - DDS topics: reference/dds-topics.md
      - Joints: reference/joints.md
      - Network: reference/network.md

theme:
  name: material
  custom_dir: docs/overrides
  icon:
    repo: fontawesome/brands/github
  logo: assets/mark.svg
  favicon: assets/favicon.svg
  font:
    text: Space Grotesk
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: paper
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Paper
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - search.share
    - announce.dismiss

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: sr-diagram
          format: !!python/name:pymdownx.superfences.fence_code_format ''
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.betterem
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - def_list
  - footnotes
  - toc:
      permalink: "·"

plugins:
  - search:
      lang: en

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cagataycali/neon-the-g1
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/cagataycali
  status:
    new: recently added
    deprecated: deprecated
