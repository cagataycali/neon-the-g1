<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <script>
      // Scheme before paint: a stored choice (Configuration) wins, else the OS. Material's docs do the same for the Strands site.
      (function () {
        var k = "neon-scheme", s = null
        try { s = localStorage.getItem(k) } catch (e) {}
        var dark = s ? s === "dark" : matchMedia("(prefers-color-scheme: dark)").matches
        document.documentElement.setAttribute("data-scheme", dark ? "dark" : "paper")
        if (!s) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function (e) {
          try { if (localStorage.getItem(k)) return } catch (err) {}
          document.documentElement.setAttribute("data-scheme", e.matches ? "dark" : "paper")
        })
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" />
    <link rel="icon" type="image/svg+xml" href="/neon.svg" />
    <meta name="description" content="neon / G1: the Unitree G1 cockpit. Cameras, lidar, telemetry and the agent. Sign in with a passkey." />
    <meta name="robots" content="noindex" />
    <title>neon / G1</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
